<div id="setup-section" class="section active">
  <div class="card">
    <h1 style="margin-bottom:2px">エセウルフ</h1>
    <p class="subtitle">お題を描きながら、エセを見破れ！</p>
    <h2>ゲーム設定</h2>

    <div class="label">プレイヤー人数</div>
    <div class="counter mb1">
      <button onclick="changePlayers(-1)">－</button>
      <span class="counter-val" id="player-count-disp">3</span>
      <button onclick="changePlayers(1)">＋</button>
      <span class="muted fs13">人 (3〜10)</span>
    </div>

    <div class="flex gap16 wrap mb1">
      <div>
        <div class="label">エセ人数</div>
        <div class="counter">
          <button onclick="changeEse(-1)">－</button>
          <span class="counter-val" id="ese-count-disp">1</span>
          <button onclick="changeEse(1)">＋</button>
          <span class="muted fs13">人</span>
        </div>
      </div>
      <div>
        <div class="label">制限時間 (秒/人)</div>
        <div class="counter">
          <button onclick="changeTime(-10)">－</button>
          <span class="counter-val" id="time-disp">30</span>
          <button onclick="changeTime(10)">＋</button>
          <span class="muted fs13">秒</span>
        </div>
      </div>
      <div>
        <div class="label">ラウンド数</div>
        <div class="counter">
          <button onclick="changeRounds(-1)">－</button>
          <span class="counter-val" id="rounds-disp">2</span>
          <button onclick="changeRounds(1)">＋</button>
          <span class="muted fs13">周</span>
        </div>
      </div>
    </div>

    <div class="mt15">
      <div class="flex center gap8 mb05">
        <div class="label" style="margin:0">カテゴリ (複数選択可)</div>
        <button class="cat-all-btn" onclick="selectAllCats(true)">全選択</button>
        <button class="cat-all-btn" onclick="selectAllCats(false)">全解除</button>
      </div>
      <div class="flex gap4 wrap" id="cat-list"></div>
    </div>

    <button class="btn-primary w100 mt2" style="padding:12px" onclick="startGame()">ゲームスタート</button>
  </div>
</div>

<!-- ========== お題確認 ========== -->
<div id="reveal-section" class="section">
  <div class="card">
    <!-- プレイヤーバナー -->
    <div class="player-banner">
      <span class="player-banner-name" id="reveal-name-label"></span>
      <span class="player-banner-progress" id="reveal-progress"></span>
    </div>
    <!-- 進行ドット -->
    <div class="progress-dots" id="reveal-dots"></div>

    <!-- お題ボックス：常に同じテキストを表示、内容は不可視 -->
    <div class="topic-box" id="reveal-topic" onclick="toggleReveal()">ここをタップして確認</div>
    <p class="fs13 muted text-center mb1" id="reveal-hint"></p>

    <div class="flex gap8">
      <button id="reroll-btn" style="display:none;padding:10px 14px" onclick="rerollTopic()">🎲 お題を変える</button>
      <button class="btn-primary" style="padding:10px;flex:1" onclick="nextReveal()">確認した → 次へ</button>
    </div>
  </div>
</div>

<!-- ========== お絵描き ========== -->
<div id="draw-section" class="section">
  <div class="card" style="padding:0.85rem">
    <!-- プレイヤーバナー -->
    <div class="player-banner">
      <span class="player-banner-name" id="draw-turn-name"></span>
      <div class="flex center gap8">
        <div class="timer-num" id="draw-timer-num"></div>
        <span class="player-banner-progress" id="draw-round-info"></span>
      </div>
    </div>
    <!-- 進行ドット -->
    <div class="progress-dots" id="draw-dots"></div>

    <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar" style="width:100%"></div></div>

    <!-- プレイヤーカラー凡例 -->
    <div class="flex gap8 center wrap mb05 fs12 muted" id="player-color-legend" style="row-gap:4px"></div>

    <!-- ツールバー -->
    <div class="flex gap8 center wrap mb05" style="row-gap:6px">
      <!-- 現在色インジケーター + 色展開ボタン -->
      <div class="color-current" id="color-current" onclick="toggleColorPalette()" style="cursor:pointer" title="色を変える"></div>
      <button class="btn-icon" id="color-toggle-btn" onclick="toggleColorPalette()" style="font-size:12px;padding:4px 8px">色 ▼</button>
      <!-- 色選択（初期非表示） -->
      <div id="color-palette-wrap" style="display:none;width:100%">
        <div id="color-btns" class="flex gap8 center wrap" style="margin-bottom:4px"></div>
      </div>
      <!-- 太さ・ツール -->
      <div class="flex gap4 center wrap">
        <button class="btn-icon" onclick="setSize(3)">細</button>
        <button class="btn-icon" onclick="setSize(8)">中</button>
        <button class="btn-icon" onclick="setSize(18)">太</button>
        <button class="btn-icon" onclick="setEraser()">消しゴム</button>
        <button class="btn-icon" id="undo-btn" onclick="undo()" disabled>↩ 戻す</button>
        <button class="btn-icon" id="redo-btn" onclick="redo()" disabled>進む ↪</button>
        <button class="btn-icon" onclick="clearCanvas()">全消去</button>
      </div>
    </div>

    <!-- キャンバス＋タイムアップオーバーレイ -->
    <div style="position:relative;display:inline-block;max-width:100%;width:100%">
      <canvas id="canvas" width="640" height="400" style="display:block;width:100%"></canvas>
      <div id="canvas-lock" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.45);border-radius:var(--radius-md);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff;font-size:20px;font-weight:700">
        ⏱ 時間終了！
        <span style="font-size:13px;opacity:0.85">「描き終わった」を押して次へ</span>
      </div>
    </div>

    <div class="text-center mt1">
      <button class="btn-primary" style="padding:10px 28px" onclick="nextTurn()">描き終わった →</button>
    </div>
  </div>
</div>

<!-- ========== 投票 ========== -->
<div id="vote-section" class="section">
  <div class="card">
    <h2>投票タイム</h2>
    <p class="fs13 muted mb1">このキャンバスを見て、エセだと思う人に投票しよう！</p>
    <canvas id="vote-canvas" width="640" height="400" style="max-width:100%;margin-bottom:1rem"></canvas>
    <div id="vote-rows"></div>
    <button class="btn-primary w100 mt15" style="padding:11px" onclick="showResult()">結果発表</button>
  </div>
</div>

<!-- ========== 結果 ========== -->
<div id="result-section" class="section">
  <div class="card">
    <h2 class="text-center" id="result-title"></h2>

    <!-- エセ回答中は隠す -->
    <div id="result-topic-block" class="result-block">
      <div class="label">お題</div>
      <div class="fs22" id="result-topic"></div>
    </div>
    <div id="result-teams-block" class="result-block flex gap8 wrap">
      <div style="flex:1;min-width:120px">
        <div class="label">エセ</div>
        <div id="result-ese-list"></div>
      </div>
      <div style="flex:1;min-width:120px">
        <div class="label">本物</div>
        <div id="result-real-list"></div>
      </div>
    </div>
    <div class="result-block">
      <div class="label">投票結果 (最多票)</div>
      <div id="result-vote-outcome"></div>
    </div>

    <!-- エセ逆転チャンス -->
    <div id="ese-guess-section" class="result-block" style="display:none">
      <div class="label">エセの最後のチャンス！お題を当てよう</div>
      <div id="ese-guesser-names" class="mb05"></div>
      <div class="flex gap8 mt05">
        <input type="text" id="ese-guess-input" placeholder="お題を入力" style="flex:1">
        <button class="btn-primary" onclick="checkEseGuess()">回答</button>
      </div>
      <div id="ese-guess-result" class="fs13 mt05"></div>
    </div>

    <div class="winner-banner" id="final-winner"></div>

    <canvas id="result-canvas" width="640" height="400" style="max-width:100%;margin-bottom:1rem"></canvas>
    <button class="w100" style="padding:11px" onclick="resetGame()">もう一度プレイ</button>
  </div>
</div>

<script>
/* ===== グローバル状態 ===== */
let QUESTIONS      = {};
let ALL_CATEGORIES = [];
let selectedCats   = [];

let playerCount   = 3;
let eseCount      = 1;
let timePerPlayer = 30;
let totalRounds   = 2;

let players    = [];
let eseIndices = [];
let topic      = '';
let revealIndex = 0;
let revealed    = false;
let hasRevealed = false;
let currentTurn = 0;
let round       = 1;

let timerInterval = null;
let timeLeft      = 0;

let drawColor = '#222222';
let drawSize  = 6;
let isEraser  = false;
let isDrawing = false;
let lastX = 0, lastY = 0;

// undo/redo スタック（ImageData を保持）
let undoStack = [];
let redoStack = [];
const MAX_HISTORY = 40;

// ターン開始時のキャンバス状態（全消去の戻し先）
let turnStartState = null;
// タイムアップでキャンバスをロック
let canvasLocked = false;

let votes = {};

/* ===== 初期化：JSON読み込み ===== */
async function loadQuestions() {
  try {
    const res = await fetch('questions.json');
    if (!res.ok) throw new Error();
    QUESTIONS = await res.json();
  } catch(e) {
    alert('questions.json が読み込めませんでした。\nindex.html と同じフォルダにあるか確認してください。\n（Live Server経由で開いてください）');
    return;
  }
  ALL_CATEGORIES = Object.keys(QUESTIONS);
  selectedCats   = [...ALL_CATEGORIES];
  renderCats();
}

/* ===== カウンター操作 ===== */
function changePlayers(d) {
  playerCount = Math.min(10, Math.max(3, playerCount + d));
  document.getElementById('player-count-disp').textContent = playerCount;
  if (eseCount >= playerCount) { eseCount = playerCount - 1; updateEseDisp(); }
}
function changeEse(d) {
  eseCount = Math.min(playerCount - 1, Math.max(1, eseCount + d));
  updateEseDisp();
}
function changeTime(d)   { timePerPlayer = Math.min(120, Math.max(10, timePerPlayer + d)); document.getElementById('time-disp').textContent   = timePerPlayer; }
function changeRounds(d) { totalRounds   = Math.min(5,   Math.max(1,  totalRounds   + d)); document.getElementById('rounds-disp').textContent = totalRounds; }
function updateEseDisp() { document.getElementById('ese-count-disp').textContent = eseCount; }

/* ===== カテゴリ ===== */
function selectAllCats(flag) {
  selectedCats = flag ? [...ALL_CATEGORIES] : [];
  if (!flag && ALL_CATEGORIES.length) selectedCats = []; // 全解除は本当に空に
  renderCats();
}
function renderCats() {
  const el = document.getElementById('cat-list');
  el.innerHTML = '';
  ALL_CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-tag' + (selectedCats.includes(cat) ? ' on' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      if (selectedCats.includes(cat)) selectedCats = selectedCats.filter(c => c !== cat);
      else selectedCats.push(cat);
      if (!selectedCats.length) selectedCats = [cat]; // 最低1つ残す
      renderCats();
    };
    el.appendChild(btn);
  });
}

/* ===== ゲーム開始 ===== */
function startGame() {
  if (!ALL_CATEGORIES.length) { alert('お題データが読み込まれていません。'); return; }
  players = Array.from({ length: playerCount }, (_, i) => `プレイヤー${i + 1}`);

  const cats = selectedCats.length ? selectedCats : ALL_CATEGORIES;
  const cat  = cats[Math.floor(Math.random() * cats.length)];
  topic = QUESTIONS[cat][Math.floor(Math.random() * QUESTIONS[cat].length)];

  const shuffled = [...Array(playerCount).keys()].sort(() => Math.random() - 0.5);
  eseIndices = shuffled.slice(0, eseCount);

  revealIndex = 0; revealed = false; hasRevealed = false;
  show('reveal-section');
  showReveal();
}

/* ===== お題確認フェーズ ===== */
function renderRevealDots() {
  const el = document.getElementById('reveal-dots');
  el.innerHTML = '';
  for (let i = 0; i < playerCount; i++) {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < revealIndex ? ' done' : i === revealIndex ? ' current' : '');
    el.appendChild(d);
  }
}

function showReveal() {
  document.getElementById('reveal-name-label').textContent  = `${players[revealIndex]} さん`;
  document.getElementById('reveal-progress').textContent    = `${revealIndex + 1} / ${playerCount} 人`;
  renderRevealDots();

  // お題ボックスは常に同じ見た目・テキスト（エセかどうか不明）
  const topicEl = document.getElementById('reveal-topic');
  topicEl.className   = 'topic-box';          // 常にぼかし無し・統一テキスト
  topicEl.textContent = 'ここをタップして確認';
  topicEl.style.fontSize   = '';
  topicEl.style.fontWeight = '';
  topicEl.style.color      = '';

  document.getElementById('reveal-hint').textContent = '';
  revealed = false; hasRevealed = false;
}

function toggleReveal() {
  revealed = !revealed;
  if (revealed) hasRevealed = true;
  const topicEl  = document.getElementById('reveal-topic');
  const hintEl   = document.getElementById('reveal-hint');
  const rerollEl = document.getElementById('reroll-btn');
  const isEse    = eseIndices.includes(revealIndex);
  const isFirst  = revealIndex === 0 && !isEse;

  if (revealed) {
    topicEl.className   = 'topic-box revealed';
    topicEl.textContent = isEse ? 'あなたはエセです！' : topic;
    hintEl.textContent  = '確認したら隠してから次へ進んでください';
    // プレイヤー1（エセでない）のときだけお題変更ボタンを表示
    if (isFirst) rerollEl.style.display = 'inline-block';
  } else {
    topicEl.className   = 'topic-box';
    topicEl.textContent = 'ここをタップして隠す';
    hintEl.textContent  = '';
    rerollEl.style.display = 'none';
    setTimeout(() => {
      if (!revealed) topicEl.textContent = 'ここをタップして確認';
    }, 1200);
  }
}

function rerollTopic() {
  const cats = selectedCats.length ? selectedCats : ALL_CATEGORIES;
  const cat  = cats[Math.floor(Math.random() * cats.length)];
  topic = QUESTIONS[cat][Math.floor(Math.random() * QUESTIONS[cat].length)];
  // 表示中なら即更新
  const topicEl = document.getElementById('reveal-topic');
  if (revealed) topicEl.textContent = topic;
}

function nextReveal() {
  if (revealed)     { alert('お題を隠してから次へ進んでください'); return; }
  if (!hasRevealed) { alert('お題を確認してから次へ進んでください'); return; }
  revealIndex++;
  if (revealIndex >= playerCount) { startDraw(); }
  else { showReveal(); }
}

/* ===== お絵描きフェーズ ===== */
function startDraw() {
  currentTurn = 0; round = 1;
  undoStack = []; redoStack = [];
  canvasLocked = false;
  initCanvas();
  renderPlayerColorLegend();
  show('draw-section');
  showTurn();
}

function renderPlayerColorLegend() {
  const el = document.getElementById('player-color-legend');
  el.innerHTML = '';
  players.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'flex center gap4';
    item.style.cssText = 'flex:0 0 auto';
    const dot = document.createElement('div');
    dot.style.cssText = `width:12px;height:12px;border-radius:50%;background:${PLAYER_COLORS[i % PLAYER_COLORS.length]};flex-shrink:0;border:1px solid rgba(0,0,0,0.15)`;
    const label = document.createElement('span');
    label.textContent = `${p}`;
    item.appendChild(dot);
    item.appendChild(label);
    el.appendChild(item);
  });
}

function initCanvas() {
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  turnStartState = ctx.getImageData(0, 0, canvas.width, canvas.height);
  pushUndo();
  setupCanvasEvents(canvas, ctx);
}

function saveCanvasState() {
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
  updateHistoryBtns();
}

function pushUndo() {
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  updateHistoryBtns();
}

function undo() {
  if (undoStack.length <= 1) return;
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  redoStack.push(undoStack.pop());
  ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
  updateHistoryBtns();
}

function redo() {
  if (!redoStack.length) return;
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const state  = redoStack.pop();
  undoStack.push(state);
  ctx.putImageData(state, 0, 0);
  updateHistoryBtns();
}

function updateHistoryBtns() {
  document.getElementById('undo-btn').disabled = undoStack.length <= 1;
  document.getElementById('redo-btn').disabled = redoStack.length === 0;
}

function setupCanvasEvents(canvas, ctx) {
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  canvas.onmousedown = e => {
    if (canvasLocked) return;
    isDrawing = true;
    const r = canvas.getBoundingClientRect();
    lastX = (e.clientX - r.left) * (canvas.width  / r.width);
    lastY = (e.clientY - r.top)  * (canvas.height / r.height);
    dot(ctx, lastX, lastY);
  };
  canvas.onmousemove = e => {
    if (canvasLocked || !isDrawing) return;
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (canvas.width  / r.width);
    const y = (e.clientY - r.top)  * (canvas.height / r.height);
    stroke(ctx, x, y);
  };
  canvas.onmouseup = () => { if (isDrawing) { isDrawing = false; pushUndo(); } };
  canvas.onmouseleave = () => { if (isDrawing) { isDrawing = false; pushUndo(); } };

  canvas.ontouchstart = e => {
    if (canvasLocked) return;
    e.preventDefault();
    isDrawing = true;
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    lastX = (t.clientX - r.left) * (canvas.width  / r.width);
    lastY = (t.clientY - r.top)  * (canvas.height / r.height);
    dot(ctx, lastX, lastY);
  };
  canvas.ontouchmove = e => {
    if (canvasLocked) return;
    e.preventDefault();
    if (!isDrawing) return;
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    const x = (t.clientX - r.left) * (canvas.width  / r.width);
    const y = (t.clientY - r.top)  * (canvas.height / r.height);
    stroke(ctx, x, y);
  };
  canvas.ontouchend = () => { if (isDrawing) { isDrawing = false; pushUndo(); } };
}

function dot(ctx, x, y) {
  ctx.beginPath();
  ctx.arc(x, y, (isEraser ? drawSize * 2 : drawSize) / 2, 0, Math.PI * 2);
  ctx.fillStyle = isEraser ? '#ffffff' : drawColor;
  ctx.fill();
}

function stroke(ctx, x, y) {
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(x, y);
  ctx.strokeStyle = isEraser ? '#ffffff' : drawColor;
  ctx.lineWidth   = isEraser ? drawSize * 2 : drawSize;
  ctx.stroke();
  lastX = x; lastY = y;
}

const PLAYER_COLORS = [
  '#e24b4a','#378add','#1D9E75','#EF9F27',
  '#D4537E','#7B5EA7','#2AABB8','#888780',
  '#C47A2B','#4a7a1a'
];

function renderColorBtns() {
  const colors = ['#1a1a18','#e24b4a','#378add','#1D9E75','#EF9F27','#D4537E','#7B5EA7','#2AABB8','#888780','#ffffff'];
  const el = document.getElementById('color-btns');
  el.innerHTML = '';
  colors.forEach(c => {
    const d = document.createElement('div');
    d.className = 'color-dot' + (!isEraser && c === drawColor ? ' active' : '');
    d.style.background = c;
    d.style.border = c === '#ffffff' ? '1.5px solid #ccc' : '2px solid transparent';
    d.onclick = () => { drawColor = c; isEraser = false; renderColorBtns(); updateColorCurrent(); closeColorPalette(); };
    el.appendChild(d);
  });
  updateColorCurrent();
}

function updateColorCurrent() {
  const el = document.getElementById('color-current');
  if (isEraser) {
    el.style.background = '#ffffff';
    el.style.backgroundImage = 'repeating-linear-gradient(45deg,#ccc 0,#ccc 2px,transparent 0,transparent 50%)';
    el.style.backgroundSize = '6px 6px';
    el.title = '消しゴム';
  } else {
    el.style.background = drawColor;
    el.style.backgroundImage = '';
    el.title = '';
  }
}

function toggleColorPalette() {
  const wrap = document.getElementById('color-palette-wrap');
  const btn  = document.getElementById('color-toggle-btn');
  const open = wrap.style.display === 'none';
  wrap.style.display = open ? 'block' : 'none';
  btn.textContent    = open ? '色 ▲' : '色 ▼';
}

function closeColorPalette() {
  document.getElementById('color-palette-wrap').style.display = 'none';
  document.getElementById('color-toggle-btn').textContent = '色 ▼';
}

function setSize(s)  { drawSize = s; isEraser = false; renderColorBtns(); }
function setEraser() { isEraser = true; drawSize = 18; renderColorBtns(); }
function clearCanvas() {
  if (!turnStartState) return;
  const c   = document.getElementById('canvas');
  const ctx = c.getContext('2d');
  ctx.putImageData(turnStartState, 0, 0);
  // undoスタックをターン開始状態にリセット
  undoStack = [turnStartState];
  redoStack = [];
  updateHistoryBtns();
}

function renderDrawDots() {
  const el = document.getElementById('draw-dots');
  el.innerHTML = '';
  for (let i = 0; i < playerCount; i++) {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < currentTurn ? ' done' : i === currentTurn ? ' current' : '');
    el.appendChild(d);
  }
}

function showTurn() {
  drawColor = PLAYER_COLORS[currentTurn % PLAYER_COLORS.length];
  isEraser  = false;
  canvasLocked = false;

  // ターン開始時のキャンバス状態を保存（全消去の戻し先）
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  turnStartState = ctx.getImageData(0, 0, canvas.width, canvas.height);
  // undoスタックもターン開始状態からリセット
  undoStack = [turnStartState];
  redoStack = [];
  updateHistoryBtns();

  // ロックオーバーレイを隠す
  const lock = document.getElementById('canvas-lock');
  lock.style.display = 'none';
  canvas.style.cursor = 'crosshair';

  // 色パレットを閉じる
  closeColorPalette();

  document.getElementById('draw-turn-name').textContent  = `${players[currentTurn]} さんの番`;
  document.getElementById('draw-round-info').textContent = `第${round}R (${currentTurn + 1}/${playerCount})`;
  renderColorBtns();
  renderDrawDots();
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = timePerPlayer;
  const bar = document.getElementById('timer-bar');
  const num = document.getElementById('draw-timer-num');
  bar.style.width      = '100%';
  bar.style.background = 'var(--c-timer-ok)';
  num.textContent      = timeLeft;

  timerInterval = setInterval(() => {
    timeLeft--;
    num.textContent      = timeLeft;
    const pct            = timeLeft / timePerPlayer * 100;
    bar.style.width      = pct + '%';
    bar.style.background = pct > 60 ? 'var(--c-timer-ok)' : pct > 30 ? 'var(--c-timer-mid)' : 'var(--c-timer-low)';
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      bar.style.width = '0%';
      canvasLocked = true;
      isDrawing = false;
      const lock = document.getElementById('canvas-lock');
      lock.style.display = 'flex';
      document.getElementById('canvas').style.cursor = 'not-allowed';
    }
  }, 1000);
}

function nextTurn() {
  clearInterval(timerInterval);
  currentTurn++;
  if (currentTurn >= playerCount) {
    if (round >= totalRounds) { goToVote(); }
    else { round++; currentTurn = 0; showTurn(); }
  } else { showTurn(); }
}

/* ===== 投票フェーズ ===== */
function goToVote() {
  clearInterval(timerInterval);
  copyCanvas('canvas', 'vote-canvas');
  votes = {};
  const el = document.getElementById('vote-rows');
  el.innerHTML = '';
  players.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'vote-row';
    row.innerHTML = `
      <span class="vote-name">${p}</span>
      <button class="btn-ese" onclick="vote(${i}, 'ese', this)">エセ</button>
      <button class="btn-real" onclick="vote(${i}, 'real', this)">本物</button>`;
    el.appendChild(row);
  });
  show('vote-section');
}

function vote(idx, type, btn) {
  votes[idx] = type;
  const row  = btn.parentElement;
  row.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

/* ===== 結果フェーズ ===== */
function showResult() {
  const eseNames  = eseIndices.map(i => players[i]);
  const realNames = players.filter((_, i) => !eseIndices.includes(i));

  const eseVotes = {};
  Object.entries(votes).forEach(([idx, type]) => {
    if (type === 'ese') eseVotes[idx] = (eseVotes[idx] || 0) + 1;
  });
  const sorted  = Object.entries(eseVotes).sort((a, b) => b[1] - a[1]);
  const topVote = sorted.length ? sorted[0] : null;
  const topIdx  = topVote ? parseInt(topVote[0]) : -1;
  const realWon = topIdx >= 0 && eseIndices.includes(topIdx);

  document.getElementById('result-topic').textContent   = topic;
  document.getElementById('result-ese-list').innerHTML  = eseNames.map(n  => `<span class="chip chip-ese">${n}</span> `).join('');
  document.getElementById('result-real-list').innerHTML = realNames.map(n => `<span class="chip chip-real">${n}</span> `).join('');

  if (topVote) {
    const n   = players[topIdx];
    const cls = eseIndices.includes(topIdx) ? 'chip-ese' : 'chip-real';
    document.getElementById('result-vote-outcome').innerHTML = `<span class="chip ${cls}">${n}</span> が最多票 (${topVote[1]}票)`;
  } else {
    document.getElementById('result-vote-outcome').textContent = '票が入りませんでした';
  }

  const guessSection = document.getElementById('ese-guess-section');
  const winnerEl     = document.getElementById('final-winner');

  if (realWon) {
    document.getElementById('result-title').textContent = 'エセが見つかった！最後のチャンス';
    document.getElementById('ese-guesser-names').innerHTML = eseNames.map(n => `<span class="chip chip-ese">${n}</span> `).join('');
    document.getElementById('ese-guess-input').value        = '';
    document.getElementById('ese-guess-result').textContent = '';
    guessSection.style.display = 'block';
    winnerEl.textContent = '';
    winnerEl.className   = 'winner-banner';

    // エセ回答中はお題・チーム情報を隠す
    document.getElementById('result-topic-block').classList.add('topic-hidden');
    document.getElementById('result-teams-block').classList.add('topic-hidden');
  } else {
    guessSection.style.display = 'none';
    winnerEl.textContent = '🎉 エセの勝利！本物を欺き切りました';
    winnerEl.className   = 'winner-banner winner-ese';
  }

  copyCanvas('canvas', 'result-canvas');
  show('result-section');
}

function checkEseGuess() {
  const guess = document.getElementById('ese-guess-input').value.trim();
  const resEl = document.getElementById('ese-guess-result');
  const winEl = document.getElementById('final-winner');
  if (!guess) { alert('お題を入力してください'); return; }

  // 回答後はお題・チーム情報を表示する
  document.getElementById('result-topic-block').classList.remove('topic-hidden');
  document.getElementById('result-teams-block').classList.remove('topic-hidden');

  if (guess === topic) {
    resEl.textContent = '🎉 正解！エセの勝利！';
    resEl.style.color = 'var(--c-ese)';
    winEl.textContent = '🎉 エセが正解！エセチームの勝ち！';
    winEl.className   = 'winner-banner winner-ese';
  } else {
    resEl.textContent = `不正解… 正解は「${topic}」でした。本物チームの勝ち！`;
    resEl.style.color = 'var(--c-real)';
    winEl.textContent = '🏆 本物チームの勝利！';
    winEl.className   = 'winner-banner winner-real';
  }
}

/* ===== ユーティリティ ===== */
function copyCanvas(srcId, dstId) {
  const src = document.getElementById(srcId);
  const dst = document.getElementById(dstId);
  dst.getContext('2d').drawImage(src, 0, 0);
}

function show(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function resetGame() {
  clearInterval(timerInterval);
  document.getElementById('ese-guess-input').value        = '';
  document.getElementById('ese-guess-result').textContent = '';
  document.getElementById('final-winner').textContent     = '';
  document.getElementById('final-winner').className       = 'winner-banner';
  document.getElementById('result-topic-block').classList.remove('topic-hidden');
  document.getElementById('result-teams-block').classList.remove('topic-hidden');
  show('setup-section');
}

/* ===== 起動 ===== */
loadQuestions();
</script>
